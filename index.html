<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   height=device-height,
                   initial-scale=1.0,
                   maximum-scale=1,
                   minimum-scale=1,
                   user-scalable=no">

    <title>mobile-phaser-ui</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./src/debug/mobile-dev-console/console.css" />

</head>

<body>

    <div id="productionErrorLog"></div>
    <div id="consoleLog"></div>
    <div id="main"></div>

        <!-- Must load before the console -->
        <script src="./src/debug/mobile-dev-console/errorBootstrap.js"></script>

        <!-- Import the console in a catchable way -->
        <script type="module">
            try {
                const { default: Console } = await import("./src/debug/mobile-dev-console/Console.js");

                new Console();
            } catch (error) {
                window.showFatalError("Console Startup Failed", error);
            }
        </script>

    <script src="./phaser4.js"></script>
    <script src="./main.js" type="module"></script>

</body>
</html>
