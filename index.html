<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   height=device-height,
                   initial-scale=1.0,
                   maximum-scale=1,
                   minimum-scale=1,
                   user-scalable=no">

    <title>mobile-phaser-ui</title>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #main {
            width: 100%;
            height: 100%;
        }
        
#consoleLog {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    max-height: 60vh;
    z-index: 99999;
    box-sizing: border-box;
    pointer-events: auto;
    overflow: hidden;
}

#consoleLog.collapsed {
    max-height: 40px;
}

#consoleLog .console-body {
    max-height: calc(60vh - 40px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

#consoleLog.collapsed .console-body {
    display: none;
}

#consoleLog .console-header {
    height: 40px;
    display: flex;
    align-items: center;
    box-sizing: border-box;
    padding: 0 8px;
    background: #222;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
}

#consoleLog .console-header button {
    margin-left: 6px;
    height: 30px;
    padding: 0 10px;
    border: 1px solid #666;
    border-radius: 4px;
    background: #444;
    color: white;
    font-size: 14px;
}

#consoleLog .console-title {
    margin-right: auto;
}

    </style>

</head>

<body>

    <div id="productionErrorLog"></div>
    <div id="consoleLog"></div>
    <div id="main"></div>

    <script src="./phaser.js"></script>
    <script src="./src/debug/console.js" type="module"></script>
    <script src="./main.js" type="module"></script>

</body>
</html>
